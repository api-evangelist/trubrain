name: truBrain
description: >-
  truBrain is a Santa Monica, California nootropics and functional-beverage
  brand that makes "natural superfuels for performance" — drinkable nootropic
  shots (2,000mg of natural nootropics per 1oz bottle for focus and
  motivation), drinkable ketones (Ketone XL, 11g of pure ketones per shot for
  athletic energy and recovery), plus gummies, functional-mushroom blends,
  capsules, NAD+, hydration, and sleep supplements, packaged in recycled paper
  bottles. Founded by a team of neuroscientists and backed by 500 Global, the
  company sells direct-to-consumer through a Shopify storefront and has run a
  Regulation A+ public equity offering. This profile was surfaced from the 500
  Global portfolio and added to the API Evangelist network. truBrain is a
  consumer packaged-goods company: it publishes no first-party developer API,
  documentation, or SDKs. The only machine-readable surface at its domain is
  Shopify's Customer Accounts OpenID Connect / OAuth 2.0 discovery metadata.
